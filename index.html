<!DOCTYPE html>
<html lang="zh-TW" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f1">
  <meta name="description" content="閻姿桂 × 史奴比：以「閻・姿・桂」三字高精度排成的史奴比動力學文字藝術動畫館，具備從散落到組合成圖案的緩慢演進動畫。">
  <title>閻姿桂 × 史奴比｜高精度動力學文字藝術動畫館</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>
<body>

  <!-- Ambient Paper Grain Overlay -->
  <div class="ambient-texture" aria-hidden="true"></div>

  <!-- Main 60 FPS HTML5 Canvas Stage -->
  <canvas id="canvas-stage"></canvas>

  <!-- Museum-Grade Floating HUD -->
  <div class="art-ui">
    
    <!-- Top Header -->
    <header class="header-bar">
      <div class="brand-meta">
        <div class="brand-seal-row">
          <span class="brand-seal">閻姿桂 印</span>
          <span class="artwork-badge-pill" id="artwork-badge">ARCHIVE 01 / 07</span>
        </div>
        <div class="brand-title-row">
          <h1 class="brand-title">
            <span>閻・姿・桂</span>
            <span class="char-accent">×</span>
            <span>史奴比</span>
          </h1>
          <span class="artwork-curr-title" id="artwork-title">趴臥狗屋白日夢</span>
        </div>
        <p class="artwork-curr-quote" id="artwork-quote">「幸福就是……躺在屋頂思考人生的美好哲理。」</p>
      </div>

      <div class="header-actions">
        <!-- Theme Cycler -->
        <button class="action-btn" id="btn-theme" title="切換藝術風格" aria-label="切換藝術風格">
          <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </button>

        <!-- Calligraphy Wand / Brush Toggle -->
        <button class="action-btn" id="btn-brush" title="開啟文字筆刷繪畫模式" aria-label="文字筆刷">
          <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>
        </button>

        <!-- Web Audio Synthesizer Toggle -->
        <button class="action-btn" id="btn-sound" title="音效開關" aria-label="音效開關">
          <div class="sound-bars active">
            <span></span><span></span><span></span>
          </div>
        </button>
      </div>
    </header>

    <!-- Bottom Dock: Completely Non-Obstructive Evolution & Poses -->
    <footer class="bottom-dock">
      <!-- Sleek Non-Obstructive Evolution Timeline Bar -->
      <div class="evolution-controller">
        <div class="evolution-row">
          <button class="evo-btn" id="btn-evo-play" title="播放/暫停演進">
            <svg id="evo-play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div class="evo-slider-container">
            <input type="range" id="evolution-scrubber" min="0" max="100" step="0.2" value="100" aria-label="演進進度滑桿">
          </div>
          <button class="evo-btn" id="btn-evo-replay" title="散落重組">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          </button>
          <span class="evolution-status" id="evolution-status">100%</span>
          <div class="evolution-speed-pills">
            <button class="speed-pill" data-speed="0.5">0.5x</button>
            <button class="speed-pill active" data-speed="1.0">1.0x</button>
            <button class="speed-pill" data-speed="2.0">2.0x</button>
          </div>
        </div>
      </div>

      <!-- 7 Poses Selection Ribbon -->
      <nav class="pose-nav-ribbon" id="pose-nav" aria-label="史奴比姿勢導覽">
        <!-- Dynamically populated chips -->
      </nav>

      <!-- Action Tools Toolbar -->
      <div class="tool-bar">
        <!-- Auto Play Carousel -->
        <div class="tool-group">
          <button class="pill-tool-btn" id="btn-autoplay" title="自動巡迴播映">
            <div class="play-ring-container">
              <svg class="progress-ring" width="30" height="30">
                <circle stroke="rgba(0,0,0,0.15)" stroke-width="2.5" fill="transparent" r="12" cx="15" cy="15"/>
                <circle id="play-ring-circle" stroke="var(--accent-red)" stroke-width="2.5" stroke-dasharray="75.4" stroke-dashoffset="75.4" fill="transparent" r="12" cx="15" cy="15"/>
              </svg>
              <svg id="play-icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span id="play-btn-text">巡迴播映</span>
          </button>

          <!-- Deconstruct / Scatter Button -->
          <button class="pill-tool-btn" id="btn-scatter" title="時空炸裂與重組">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <span id="scatter-text">散落文字</span>
          </button>
        </div>

        <!-- Wallpaper Export Button -->
        <div class="tool-group">
          <button class="pill-tool-btn primary" id="btn-export" title="產生手機高畫質桌布">
            <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
            <span>珍藏桌布</span>
          </button>
        </div>
      </div>
    </footer>

  </div>

  <!-- Wallpaper / Polaroid Postcard Modal -->
  <div class="modal-overlay" id="export-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">閻姿桂 × 史奴比 藝術明信片</h3>
        <button class="modal-close-btn" id="modal-close" aria-label="關閉視窗">&times;</button>
      </div>
      <div class="modal-body">
        <div class="preview-img-wrapper">
          <img id="export-preview-img" alt="桌布預覽" src="">
        </div>
        <p style="font-size:0.75rem; color:var(--text-secondary); text-align:center;">
          長按圖片即可儲存至手機相簿，或點擊下方按鈕直接下載高畫質桌布！
        </p>
      </div>
      <div class="modal-footer">
        <button class="download-btn" id="modal-download-btn">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
          <span>下載高畫質藝術桌布</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Load Scripts -->
  <script src="posesData.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
